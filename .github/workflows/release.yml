name: Build and release Linux packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.0.4-octa)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build Debian and RPM packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install package builders
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm make

      - name: Build packages
        id: build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          bash packaging/build-packages.sh "$version" dist
          (cd dist && sha256sum *.deb *.rpm > SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign packages with Sigstore
        run: |
          for package in dist/*.deb dist/*.rpm; do
            cosign sign-blob --yes --bundle "${package}.sigstore.json" "$package"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ete (rel -${{ steps.build.outputs.version }})
          tag_name: v${{ steps.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
